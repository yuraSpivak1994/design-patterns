<form (submit)="submit($event)">
  <mat-form-field appearance="outline">
    <mat-label>First name</mat-label>
    <input
      matInput
      type="text"
      autocomplete="given-name"
      [formField]="smsNotificationForm.firstName"
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Last name</mat-label>
    <input
      matInput
      type="text"
      autocomplete="family-name"
      [formField]="smsNotificationForm.lastName"
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Phone</mat-label>
    <input
      matInput
      type="tel"
      autocomplete="tel"
      [formField]="smsNotificationForm.phone"
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Sender name</mat-label>
    <input matInput type="text" [formField]="smsNotificationForm.senderName" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Message</mat-label>
    <textarea matInput rows="5" [formField]="smsNotificationForm.message"></textarea>
  </mat-form-field>

  <button matButton="filled" type="submit">Send SMS</button>
</form>

@if (preview(); as smsPreview) {
  <mat-card appearance="outlined" class="preview-card">
    <mat-card-header>
      <mat-card-title>SMS preview</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <dl class="preview-list">
        <div>
          <dt>Name</dt>
          <dd>{{ smsPreview.firstName }} {{ smsPreview.lastName }}</dd>
        </div>
        <div>
          <dt>Phone</dt>
          <dd>{{ smsPreview.phone }}</dd>
        </div>
        <div>
          <dt>Sender name</dt>
          <dd>{{ smsPreview.senderName }}</dd>
        </div>
        <div>
          <dt>Message</dt>
          <dd>{{ smsPreview.message }}</dd>
        </div>
      </dl>
    </mat-card-content>
  </mat-card>
}
