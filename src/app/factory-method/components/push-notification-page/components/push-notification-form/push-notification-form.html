<form (submit)="submit($event)">
  <mat-form-field appearance="outline">
    <mat-label>First name</mat-label>
    <input
      matInput
      type="text"
      autocomplete="given-name"
      [formField]="pushNotificationForm.firstName"
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Last name</mat-label>
    <input
      matInput
      type="text"
      autocomplete="family-name"
      [formField]="pushNotificationForm.lastName"
    />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Device token</mat-label>
    <input matInput type="text" [formField]="pushNotificationForm.deviceToken" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Title</mat-label>
    <input matInput type="text" [formField]="pushNotificationForm.title" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Message</mat-label>
    <textarea matInput rows="5" [formField]="pushNotificationForm.message"></textarea>
  </mat-form-field>

  <button matButton="filled" type="submit">Send push</button>
</form>

@if (previewItems(); as pushPreviewItems) {
  <app-notification-preview-card title="Push preview" [items]="pushPreviewItems" />
}
